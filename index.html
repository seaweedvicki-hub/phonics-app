<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Phonics Game</title>

<link rel="stylesheet" href="style.css">

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>

<link rel="manifest" href="manifest.json">
</head>

<body>

<div class="app">

<!-- 登入 -->
<div id="login">
  <h2>🎮 AI英文老師</h2>
  <input id="name" placeholder="輸入名字">
  <button onclick="login()">開始</button>
</div>

<!-- 主頁 -->
<div id="home" class="hidden">
  <h2 id="username"></h2>

  <button onclick="startLearn()">📚 學習</button>
  <button onclick="startMap()">🗺️ 闖關</button>
  <button onclick="startSpeaking()">🎤 口說</button>
  <button onclick="startWeakPractice()">🔥 錯字練習</button>
  <button onclick="openAI()">🤖 AI老師</button>
  <button onclick="showReport()">📊 家長報告</button>
</div>

<!-- AI老師 -->
<div id="ai" class="hidden">
  <h2>🤖 AI老師</h2>
  <div id="chatBox"></div>
  <input id="aiInput" placeholder="問老師問題">
  <button onclick="askAI()">送出</button>
</div>

<!-- 其他區塊（保留） -->
<div id="learn" class="hidden card">
  <h1 id="word"></h1>
  <p id="phonics"></p>
  <p id="meaning"></p>
  <button onclick="nextLearn()">下一個</button>
</div>

<div id="map" class="hidden">
  <div id="mapArea"></div>
</div>

<div id="quiz" class="hidden">
  <h2 id="target"></h2>
  <div id="dropZone"></div>
  <div id="choices"></div>
</div>

<div id="speaking" class="hidden">
  <h1 id="speakWord"></h1>
  <button onclick="startRecording()">開始說</button>
  <p id="speakResult"></p>
</div>

<div id="report" class="hidden">
  <div id="reportData"></div>
</div>

</div>

<script src="firebase.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>

</body>
</html>
