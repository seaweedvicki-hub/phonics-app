<div class="app hidden">

  <h1>🦁 自然發音拼字記憶大師</h1>

  <div class="card">
    <img id="image" class="word-img">

    <h1 id="word"></h1>
    <p id="phonics"></p>
    <p id="meaning"></p>

    <button onclick="playPhonics()">🔊 發音拆解</button>
    <button onclick="nextLearn()">下一個</button>
    <button onclick="startQuizMode()">開始測驗</button>
  </div>

  <!-- 🎯 測驗 -->

    <h2>🧠 拼字測驗</h2>
    <div id="choices"></div>

  </div>

</div>
