<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phonics App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🟢 登入 -->
<div class="login">
  <input placeholder="輸入名字" id="name">
  <button onclick="login(document.getElementById('name').value)">登入</button>
</div>

<!-- 🟢 控制 -->
<div class="controls">
  <button onclick="nextLearn()">下一個（預習）</button>
  <button onclick="startQuizMode()">開始測驗</button>
</div>

<!-- 🟡 原本主畫面（保留） -->
<div class="card">
  <img id="image" class="word-img">

  <h1 id="word"></h1>
  <p id="phonics"></p>
  <p id="meaning"></p>

  <button onclick="speak(currentWord.word)">🔊 單字發音</button>
  <button onclick="playPhonics()">🎬 自然發音</button>
  <button onclick="nextWord()">下一個</button>
  <button onclick="startQuiz()">🎯 測驗</button>
</div>

<!-- 🟢 測驗 -->
<div class="quiz hidden">
  <h2>🧠 選出正確圖片</h2>
  <div id="choices"></div>
  <p id="result"></p>
</div>

<script src="app.js"></script>

</body>
</html>
