<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phonics App</title>
</head>

<body>

<!-- 登入 -->
<div id="loginBox">
  <h2>輸入名字</h2>
  <input id="name">
  <button onclick="login(document.getElementById('name').value)">開始</button>
</div>

<!-- 主畫面 -->
<div id="app" style="display:none">

  <h1 id="word"></h1>
  <p id="phonics"></p>
  <p id="meaning"></p>

  <img id="image" width="150">

  <br><br>

  <button onclick="playPhonics()">🔊 發音</button>
  <button onclick="nextLearn()">下一個</button>

  <div id="quiz" style="display:none">
    <h2>選出正確發音</h2>
    <div id="choices"></div>
    <p id="result"></p>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
