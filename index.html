<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phonics Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 👤 登入 -->
<div class="login">
  <input id="name" placeholder="輸入名字">
  <button onclick="login()">開始冒險</button>
</div>

<!-- 🗺️ 遊戲地圖 -->
<div id="map" class="hidden">
  <h2>🌍 闖關地圖</h2>
  <div id="levels"></div>
</div>

<!-- 📚 學習 -->
<div class="card hidden" id="learnBox">
  <h2 id="progress"></h2>

  <img id="image" class="word-img">

  <h1 id="word"></h1>
  <p id="phonics"></p>
  <p id="meaning"></p>

  <button onclick="playPhonics()">🔊 發音</button>
  <button onclick="nextLearn()">下一個</button>
</div>

<!-- 🎯 測驗 -->
<div class="quiz hidden" id="quizBox">
  <h2 id="quizWord"></h2>
  <div id="choices"></div>
  <p id="result"></p>
</div>

<!-- 📊 成績 -->
<div class="result hidden" id="resultBox">
  <h2 id="score"></h2>
  <button onclick="backToMap()">回地圖</button>
</div>

<!-- 📊 家長報告 -->
<div id="report"></div>

<script src="app.js"></script>

</body>
</html>
