<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phonics Game</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

</head>

<body>

<div class="app">

<!-- 登入 -->
<div id="login">
  <h2>🎮 英文學習</h2>
  <input id="name" placeholder="輸入名字">
  <button onclick="login()">開始</button>
</div>

<!-- 主頁 -->
<div id="home" class="hidden">
  <h2 id="username"></h2>

  <button onclick="startLearn()">📚 學習</button>
  <button onclick="startQuiz()">🎯 拼音測驗</button>
  <button onclick="startSpeaking()">🎤 口說</button>
  <button onclick="startWeakPractice()">🔥 錯字練習</button>
  <button onclick="showReport()">📊 家長報告</button>
</div>

<!-- 學習 -->
<div id="learn" class="hidden card">
  <h1 id="word"></h1>
  <p id="phonics"></p>
  <p id="meaning"></p>

  <button onclick="speak(currentWord.word)">🔊</button>
  <button onclick="aiExplain()">🤖 解釋</button>
  <button onclick="nextLearn()">下一個</button>
</div>

<!-- 測驗 -->
<div id="quiz" class="hidden">
  <h2 id="target"></h2>
  <div id="dropZone"></div>
  <div id="choices"></div>
</div>

<!-- 口說 -->
<div id="speaking" class="hidden">
  <h2>🎤 說出單字</h2>
  <h1 id="speakWord"></h1>
  <button onclick="startRecording()">開始說</button>
  <p id="speakResult"></p>
</div>

<!-- 報告 -->
<div id="report" class="hidden">
  <h2>📊 學習報告</h2>

  <p id="summary"></p>
  <canvas id="chart" height="200"></canvas>
  <div id="weakWords"></div>
</div>

</div>

<script src="ai.js"></script>
<script src="app.js"></script>

</body>
</html>
