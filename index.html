<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Phonics App</title>

<!-- ⭐ 手機APP關鍵 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<!-- iPhone支援 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body { font-family: Arial; text-align:center; background:#f0f3fa; }
.card { background:white; margin:10px; padding:15px; border-radius:15px; }
button { padding:10px; margin:5px; border-radius:10px; border:none; background:#4CAF50; color:white; }
img { width:120px; height:120px; }
#choices img { width:80px; margin:10px; cursor:pointer; }
</style>
</head>

<body>

<div class="card">
  <input id="name" placeholder="輸入名字">
  <button onclick="login()">登入</button>
  <p id="user"></p>
</div>

<div class="card">
  <h2 id="level">Level 1</h2>
  <h3 id="progress">進度：0 / 10</h3>
</div>

<div class="card">
  <img id="image">
  <h1 id="word"></h1>
  <p id="phonics"></p>
  <p id="meaning"></p>

  <button onclick="playPhonics()">🎬 發音</button>
  <button onclick="startSpeaking()">🎤 我來說</button>
  <button onclick="nextLearn()">下一個</button>
  <button onclick="startQuiz()">開始測驗</button>
</div>

<div class="card">
  <div id="choices"></div>
  <p id="result"></p>
</div>

<div class="card">
  <h3>📊 學習報告</h3>
  <p id="report"></p>
</div>

<script src="app.js"></script>

<!-- ⭐ 註冊 Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
