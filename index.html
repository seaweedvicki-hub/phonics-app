<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phonics App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 👤 登入 -->
<div class="login">
  <input id="name" placeholder="輸入名字">
  <button onclick="login()">開始學習</button>
</div>

<!-- 📚 學習區 -->
<div class="card hidden" id="learnBox">
  <h2 id="progress"></h2>

  <img id="image" class="word-img">

  <h1 id="word"></h1>
  <p id="phonics"></p>
  <p id="meaning"></p>

  <button onclick="playPhonics()">🔊 發音</button>
  <button onclick="nextLearn()">下一個</button>
  <button onclick="startQuizMode()">開始測驗</button>
</div>

<!-- 🎯 測驗 -->
<div class="quiz hidden" id="quizBox">
  <h2 id="quizWord"></h2>
  <div id="choices"></div>
  <p id="result"></p>
</div>

<!-- 📊 結果 -->
<div class="result hidden" id="resultBox">
  <h2 id="score"></h2>
  <button onclick="nextGroup()">下一組</button>
</div>

<script src="app.js"></script>

</body>
</html>
