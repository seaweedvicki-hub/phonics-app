<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phonics App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 👤 登入 -->
<div class="login">
  <input id="name" placeholder="輸入名字">
  <button onclick="login()">開始學習</button>
</div>

<!-- 🎮 主APP -->
<div class="app hidden">

  <h2 id="player"></h2>

  <!-- 🗺 闖關地圖 -->
  <div id="map"></div>

  <div class="card">
    <img id="image" width="150">

    <h1 id="word"></h1>
    <div id="phonics"></div>
    <p id="meaning"></p>

    <button onclick="playPhonics()">🔊 發音</button>
    <button onclick="nextLearn()">下一個</button>
    <button onclick="startQuizMode()">🎯 測驗</button>
  </div>

  <div class="quiz hidden">
    <h3>選出正確答案</h3>
    <div id="choices"></div>
    <p id="result"></p>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
